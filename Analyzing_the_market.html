<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Mercado - Analítica de Tráfico</title>
    <style>
        :root {
            --azul-institucional: #0056b3;
            --gris-claro: #f4f6f9;
            --blanco: #ffffff;
            --texto-oscuro: #333333;
            --borde: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--gris-claro);
            color: var(--texto-oscuro);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        /* Contenedor Dashboard Estilo App Mobile (360px máximo) */
        .dashboard {
            width: 100%;
            max-width: 360px;
            background: var(--blanco);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            color: var(--azul-institucional);
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        /* Bloque de Métricas */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--gris-claro);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--borde);
        }

        .card-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
            margin-bottom: 5px;
        }

        .card-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--azul-institucional);
        }

        /* Panel de Tabla */
        .table-section {
            margin-top: 10px;
        }

        .table-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--texto-oscuro);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            background-color: var(--gris-claro);
            color: #555;
            font-weight: 600;
            padding: 10px;
            border-bottom: 2px solid var(--borde);
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--borde);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            background: var(--azul-institucional);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 11px;
        }

        /* Control de limpieza */
        .btn-reset {
            width: 100%;
            background: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 10px;
            border-radius: 8px;
            margin-top: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .btn-reset:active {
            background: #ff4d4d;
            color: white;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Estudio de Mercado</h2>

        <div class="metrics-grid">
            <div class="card">
                <div class="card-title">Tráfico Total</div>
                <div id="visitas-total" class="card-value">0</div>
            </div>
            <div class="card">
                <div class="card-title">Redirecciones</div>
                <div id="redirecciones-total" class="card-value">0</div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-title">Aperturas por País</div>
            <table id="tabla-paises">
                <thead>
                    <tr>
                        <th>País</th>
                        <th style="text-align: right;">Cargan</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <button class="btn-reset" onclick="limpiarMetricas()">Reiniciar Datos</button>
    </div>

    <script>
        function cargarAnalitica() {
            // Leer la memoria persistente del navegador
            const visitas = localStorage.getItem('total_visitas') || 0;
            const redirecciones = localStorage.getItem('total_redirecciones') || 0;
            const paises = JSON.parse(localStorage.getItem('datos_paises')) || {};

            // Desplegar números globales
            document.getElementById('visitas-total').innerText = visitas;
            document.getElementById('redirecciones-total').innerText = redirecciones;

            // Ordenar los registros geográficos descendientemente
            const listaOrdenada = Object.entries(paises).sort((a, b) => b[1] - a[1]);

            const tbody = document.querySelector('#tabla-paises tbody');
            tbody.innerHTML = ''; 

            if (listaOrdenada.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#999;">Sin datos registrados</td></tr>`;
                return;
            }

            // Insertar registros dinámicos ordenados
            listaOrdenada.forEach(([pais, conteo]) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${pais}</td>
                    <td style="text-align: right;"><span class="badge">${conteo}</span></td>
                `;
                tbody.appendChild(fila);
            });
        }

        function limpiarMetricas() {
            if(confirm("¿Seguro que deseas borrar el conteo acumulado del estudio de mercado?")) {
                localStorage.removeItem('total_visitas');
                localStorage.removeItem('total_redirecciones');
                localStorage.removeItem('datos_paises');
                cargarAnalitica();
            }
        }

        // Evento inicializador de carga de vista
        window.addEventListener('DOMContentLoaded', cargarAnalitica);
    </script>

</body>
</html>
